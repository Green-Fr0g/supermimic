[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "supermimic"
version = "0.1.0"
description = "Isaac Lab environments for supermimic."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "zhangyuheng" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab[viser]==3.0.0",
    # Pinocchio requires NumPy 2.3; keep compatibility with the supported Numba range.
    "numpy>=2.3,<2.4",
]

[project.entry-points."isaaclab.tasks"]
supermimic = "supermimic.tasks"

[project.optional-dependencies]
all = ["isaaclab[all]"]
dev = ["isaaclab[dev]"]
importers = ["isaaclab[importers]"]
isaacsim = ["isaaclab[isaacsim]"]
leapp = ["isaaclab[leapp]"]
mimic = ["isaaclab[mimic]"]
ov = ["isaaclab[ov]"]
ovphysx = ["isaaclab[ovphysx]"]
ovrtx = ["isaaclab[ovrtx]"]
rerun = ["isaaclab[rerun]"]
rlinf = ["isaaclab[rlinf]"]
sb3 = ["isaaclab[sb3]"]
skrl = ["isaaclab[skrl]"]
teleop = ["isaaclab[teleop]"]
test = ["isaaclab[test]"]
tetrahedralization = ["isaaclab[tetrahedralization]"]
torchrl = ["isaaclab[torchrl]"]
video = ["isaaclab[video]"]
viser = ["isaaclab[viser]"]
wandb = ["isaaclab[wandb]"]

[dependency-groups]
dev = ["codespell>=2.4", "pre-commit>=4.2", "pytest>=8.3", "ruff>=0.11"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Reconcile the optional Isaac Sim/OV stacks with Isaac Lab's Newton and OpenUSD runtime.
override-dependencies = [
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "packaging>=20,<27",
    # Isaac Lab 3.0 requires >=2.8; Isaac Sim 6.2 still pins 2.7.
    "urllib3>=2.8.0",
]

[tool.uv.sources]
"omniverseclient" = { index = "pypi-public" }
"ovphysx" = { index = "pypi-public" }
"ovrtx" = { index = "pypi-public" }
"ovstage" = { index = "pypi-public" }
"torch" = { index = "pytorch-cu130" }
"torchaudio" = { index = "pytorch-cu130" }
"torchvision" = { index = "pytorch-cu130" }

[tool.uv.build-backend]
module-name = ["supermimic", "supermimic_rl"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["supermimic"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab", "isaaclab_newton", "isaaclab_ov", "isaaclab_physx"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]
"isaaclab-assets" = ["isaaclab_assets"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/__init__.pyi" = ["F401", "F403"]
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__", "**/logs", ".git", ".venv", ".vscode"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: test exercises isolated logic and does not launch the simulator",
    "integration: test drives the simulator/scene/environment end-to-end",
    "smoke: tests for core installation, task, and RL functionality",
    "kitless: test must pass inside the Kit-less container, which has no Isaac Sim runtime",
]

[tool.codespell]
skip = "*.usd,*.usda,*.usdc,*.json,*.onnx,*.pt,*.mp4,*.data,uv.lock,logs"

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

